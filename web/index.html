<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#15803d" />
    <meta
      name="description"
      content="Séances, performances et finances de votre groupe de football."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/logo-transparent.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Statoo · Votre groupe, ensemble</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Aller au contenu</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Statoo, accueil">
        <img src="icons/logo-transparent.png" width="52" height="52" alt="" />
        <span class="brand-name">statoo<span class="brand-dot">.</span></span>
      </a>
      <div class="header-actions">
        <button id="theme" class="icon-button" aria-label="Changer le thème">
          ◐</button
        ><button id="install" class="secondary" hidden>Installer Statoo</button>
      </div>
    </header>
    <div id="network" role="status" hidden></div>
    <main id="content" tabindex="-1"><p>Ouverture de Statoo…</p></main>
    <p id="message" role="status" aria-live="polite"></p>
    <footer>Statoo · Le foot entre amis, les comptes au clair.</footer>
    <noscript>Activez JavaScript pour accéder à votre groupe.</noscript>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
